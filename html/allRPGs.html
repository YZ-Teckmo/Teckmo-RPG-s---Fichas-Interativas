<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="with=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/mainTheme.css">
    <link rel="stylesheet" href="../static/css/characterPage.css">
    <title>??? - ??? | Deyvid Fichas de RPG</title>
</head>

<body>
    <header>
        <nav class="nav">
            <div class="carousel" id="carouselHandler" style="width: 40%;">
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Teckmo/Teckmo.png" alt="Teckmo"
                        onclick="ChangeActiveCharacter(1)" onmouseover="GetCharacterName(1)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Zyreph/Zyreph.jpg" alt="Zyreph"
                        onclick="ChangeActiveCharacter(2)" onmouseover="GetCharacterName(2)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Kyara&Zeckrom/Zeckrom&Kyara.jpg"
                        alt="Kyara&Zeckrom" onmouseover="GetCharacterName(3)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Mizuki/Mizuki.jpg" alt="Mizuki"
                        onclick="ChangeActiveCharacter(4)" onmouseover="GetCharacterName(4)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Raven/Raven.jpg" alt="Raven"
                        onclick="ChangeActiveCharacter(5)" onmouseover="GetCharacterName(5)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Vein/Vein.jpg" alt="Vein"
                        onclick="ChangeActiveCharacter(6)" onmouseover="GetCharacterName(6)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Singularity/Himeko/Himeko.png" alt="Himeko"
                        onclick="ChangeActiveCharacter(7)" onmouseover="GetCharacterName(7)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Singularity/Ayame&Yame/Ayame.jpg" alt="Ayame"
                        onclick="ChangeActiveCharacter(8)" onmouseover="GetCharacterName(8)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Singularity/Ayame&Yame/Yame.jpg" alt="Yame"
                        onclick="ChangeActiveCharacter(9)" onmouseover="GetCharacterName(9)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Singularity/Ember/Ember.jpg" alt="Ember"
                        onclick="ChangeActiveCharacter(10)" onmouseover="GetCharacterName(10)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Singularity/Caelus/Caelus.png" alt="Caelus"
                        onclick="ChangeActiveCharacter(11)" onmouseover="GetCharacterName(11)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/Lobotomy/Vex/Vex.jpg" alt="Vex"
                        onclick="ChangeActiveCharacter(12)" onmouseover="GetCharacterName(12)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DemonSlayer/Minami/Minami.jpg" alt="Minami"
                        onclick="ChangeActiveCharacter(13)" onmouseover="GetCharacterName(13)">
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DemonSlayer/Klaus/Klaus.jpg" alt="Klaus"
                        onclick="ChangeActiveCharacter(14)" onmouseover="GetCharacterName(14)">
                </div>
            </div>
            <div class="bar"></div>
            <div class="right-container" style="width: 45%;">
                <h1 class="nav-name" id="navNameHandler">???</h1>
            </div>
            <div class="bar"></div>
            <div class="exit-div">
                <a href="../index.html">
                    <h1>Voltar</h1>
                </a>
            </div>
        </nav>
    </header>

    <div class="main-char">
        <div class="char-status">

        </div>
        <div class="char-right">
            <div class="char-info">
                <div class="portrait">
                    <img class="foto" id="portraitHandler" src="../static/assets/MainPages/character.png" alt="">
                </div>
                <h1 class="name" id="nameHandler">???</h1>
                <h1 class="title" id="titleHandler">Selectione um Personagem</h1>
                <div class="song-div" onclick="UseSongPopup(1)">
                    <img class="yt-icon" src="../static/assets/MainPages/youtube.png" alt="">
                    <div class="bar"></div>
                    <h1 class="songName" id="songNameHandler">???</h1>
                </div>
            </div>
            <div class="char-main-stats">
                <h1>Status</h1>
            </div>
        </div>

        <div class="popup" id="popupHandler">
            <div class="popup-header">
                <div class="p-left">
                    <img onclick="UseSongPopup(3)" class="close-btn" id="resizeBtnHandler"
                        src="../static/assets/MainPages/contract.png"></img>
                </div>
                <div class="p-right">
                    <img onclick="UseSongPopup(2)" class="close-btn" src="../static/assets/MainPages/cancel.png"></img>
                </div>
            </div>
            <h1 class="song-title" id="songTitleHandler"></h1>
            <div class="player-container" id="playerContainerHandler">
                <div id="playerHandler"></div>
                <input type="range" orient="vertical" class="volume-bar" value="50" min="0" max="100"
                    onchange="volumeChange(this.value)">
            </div>
            <div class="popup-footer">
                <div class="p-left">
                    <img onclick="playPauseVideo(1)" class="close-btn" id="resizeBtnHandler"
                        src="../static/assets/MainPages/play.png"></img>
                </div>
                <input id="timeSlideHandler" class="time-slide" type="range" value="" min="" max=""
                    onchange="changeVideoTime(this.value)" oninput="currentTimeSlide(this.value)">
                <div class="p-right">
                    <img onclick="playPauseVideo(2)" class="close-btn" src="../static/assets/MainPages/pause.png"></img>
                </div>
            </div>
        </div>

</body>

<script src="../static/js/pageUtils.js"></script>
<script src="../static/js/allCharactersUtils.js"></script>

</html>
