<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="with=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/mainTheme.css">
    <link rel="stylesheet" href="../static/css/characterPage.css">
    <title>??? - ??? | Deyvid Fichas de RPG</title>
</head>

<body>
    <header>
        <nav class="nav">
            <div class="carousel" id="carouselHandler" style="width: 8%;">
                <div class="character-button">
                    <img class="icon" src="../static/assets/Lobotomy/Vex/Vex.jpg" alt="Vex"
                        onclick="ChangeActiveCharacter(12)" onmouseover="GetCharacterName(12)">
                    <div class="character-name-popup">Vex</div>
                </div>
            </div>
            <div class="bar"></div>
            <div class="right-container" style="width: 77%;">
                <h1 class="nav-name" id="navNameHandler">???</h1>
            </div>
            <div class="bar"></div>
            <div class="exit-div">
                <a href="../index.html">
                    <h1>Voltar</h1>
                </a>
            </div>
        </nav>
    </header>

    <div class="main-char">
        <div class="char-status">

        </div>
        <div class="char-right">
            <div class="char-info">
                <div class="portrait">
                    <img class="foto" id="portraitHandler" src="../static/assets/MainPages/character.png" alt="">
                </div>
                <h1 class="name" id="nameHandler">???</h1>
                <h1 class="title" id="titleHandler">Selectione um Personagem</h1>
                <h1 class="level" id="levelHandler">Nível: ???</h1>
                <div class="song-div" onclick="UseSongPopup(1)">
                    <img class="yt-icon" src="../static/assets/MainPages/youtube.png" alt="">
                    <div class="bar"></div>
                    <h1 class="songName" id="songNameHandler">???</h1>
                </div>
                <h1 class="absolute" id="info1Handler">Nacionalidade: ???</h1>
                <h1 class="absolute-type" id="info2Handler">Corporação: ???</h1>
            </div>
            <div class="char-main-stats">
                <h1>Status</h1>
                <div id="allBarsHandler">
                    <h1 class="bar-title">Vida</h1>
                    <div class="bar-container" data-name="health">
                        <div class="bar-fill"></div>
                        <div class="bar-text">
                            <input class="current" oninput="allBars.health.SetCurValues()" type="number"
                                autocomplete="off">
                            <h1>/</h1>
                            <input class="max" oninput="allBars.health.SetCurValues()" type="number" autocomplete="off">
                        </div>
                    </div>

                    <h1 class="bar-title">Sanidade</h1>
                    <div class="bar-container" data-name="sanity">
                        <div class="bar-fill"></div>
                        <div class="bar-text">
                            <input class="current" type="number" oninput="allBars.sanity.SetCurValues()"
                                autocomplete="off">
                            <h1>/</h1>
                            <input class="max" type="number" oninput="allBars.sanity.SetCurValues()" autocomplete="off">
                        </div>
                    </div>

                    <h1 class="bar-title">PE</h1>
                    <div class="bar-container" data-name="stamina">
                        <div class="bar-fill"></div>
                        <div class="bar-text">
                            <input class="current" type="number" oninput="allBars.stamina.SetCurValues()"
                                autocomplete="off">
                            <h1>/</h1>
                            <input class="max" type="number" oninput="allBars.stamina.SetCurValues()"
                                autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="popup" id="popupHandler">
        <div class="popup-header">
            <div class="p-left">
                <img onclick="UseSongPopup(3)" class="close-btn" id="resizeBtnHandler"
                    src="../static/assets/MainPages/contract.png"></img>
            </div>
            <div class="p-right">
                <img onclick="UseSongPopup(2)" class="close-btn" src="../static/assets/MainPages/cancel.png"></img>
            </div>
        </div>
        <h1 class="song-title" id="songTitleHandler"></h1>
        <div class="player-container" id="playerContainerHandler">
            <div id="playerHandler"></div>
            <input type="range" orient="vertical" class="volume-bar" value="50" min="0" max="100"
                onchange="volumeChange(this.value)">
        </div>
        <div class="popup-footer">
            <div class="p-left">
                <img onclick="playPauseVideo(1)" class="close-btn" id="resizeBtnHandler"
                    src="../static/assets/MainPages/play.png"></img>
            </div>
            <input id="timeSlideHandler" class="time-slide" type="range" value="" min="" max=""
                onchange="changeVideoTime(this.value)" oninput="currentTimeSlide(this.value)">
            <div class="p-right">
                <img onclick="playPauseVideo(2)" class="close-btn" src="../static/assets/MainPages/pause.png"></img>
            </div>
        </div>
    </div>

</body>

<script src="../static/js/pageUtils.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</html>
