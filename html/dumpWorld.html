<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="with=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/mainTheme.css">
    <link rel="stylesheet" href="../static/css/characterPage.css">
    <title>??? - ??? | Deyvid Fichas de RPG</title>

    <link rel="preload" as="image" href="../static/assets/DumpWorld/Teckmo/background.png">
    <link rel="preload" as="image" href="../static/assets/DumpWorld/Zyreph/Background.png">
    <link rel="preload" as="image" href="../static/assets/DumpWorld/Mizuki/background.jpg">
    <link rel="preload" as="image" href="../static/assets/DumpWorld/Raven/backrground.jpg">
    <link rel="preload" as="image" href="../static/assets/DumpWorld/Vein/background.png">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="carousel" id="carouselHandler" style="width: 60%;">
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Teckmo/Teckmo.png" alt="Teckmo"
                        onclick="ChangeActiveCharacter(1)">
                    <div class="character-name-popup">Teckmo</div>
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Zyreph/Zyreph.jpg" alt="Zyreph"
                        onclick="ChangeActiveCharacter(2)">
                    <div class="character-name-popup">Zyreph</div>
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Kyara&Zeckrom/Zeckrom&Kyara.jpg" alt="Kyara&Zeckrom">
                    <div class="character-name-popup">Kyara&Zeckrom</div>
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Mizuki/Mizuki.jpg" alt="Mizuki"
                        onclick="ChangeActiveCharacter(4)">
                    <div class="character-name-popup">Mizuki</div>
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Raven/Raven.jpg" alt="Raven"
                        onclick="ChangeActiveCharacter(5)">
                    <div class="character-name-popup">Raven</div>
                </div>
                <div class="character-button">
                    <img class="icon" src="../static/assets/DumpWorld/Vein/Vein.jpg" alt="Vein"
                        onclick="ChangeActiveCharacter(6)">
                    <div class="character-name-popup">Vein</div>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-char">
        <div class="char-status">

        </div>
        <div class="char-info">
            <div class="portrait">
                <img class="foto" id="portraitHandler" src="../static/assets/MainPages/character.png" alt="">
            </div>
            <h1 class="name" id="nameHandler">???</h1>
            <h1 class="title" id="titleHandler">Selectione um Personagem</h1>
            <div class="song-div">
                    <img class="yt-icon" src="../static/assets/MainPages/youtube.png" alt=""> <div class="bar"></div>
                    <h1 class="songName" id="songNameHandler">???</h1>
            </div>
        </div>
    </div>

</body>

<script src="../static/js/pageUtils.js"></script>

</html>
